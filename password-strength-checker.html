<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password strength checker</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#14212b;--mute:#5b6b78;--line:#d5dce2;--r0:#c0392b;--r1:#d9822b;--r2:#b8a21a;--r3:#3b9a5a;--r4:#1f7a8c;--ok:#3b9a5a;--no:#9aa7b1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1519;--panel:#18222a;--ink:#e6edf2;--mute:#8fa0ad;--line:#2b3943;--no:#5d6d79}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1519;--panel:#18222a;--ink:#e6edf2;--mute:#8fa0ad;--line:#2b3943;--no:#5d6d79}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--r4);outline-offset:1px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:0 14px;cursor:pointer}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:16px 0 8px}
.meter i{height:8px;border-radius:2px;background:var(--line);transition:background .2s}
.verdict{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.verdict strong{font-size:1.25rem}
.verdict span{color:var(--mute);font-size:.95rem}
ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
li{display:flex;gap:10px;align-items:center;color:var(--mute)}
li b{width:20px;height:20px;border-radius:50%;background:var(--no);color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
li.ok{color:var(--ink)}li.ok b{background:var(--ok)}
.tips{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:.95rem}
.note{margin-top:14px;font-size:.85rem;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Password strength checker</h1>
<p class="sub">Type a password to see how well it would hold up. Nothing leaves your browser.</p>
<div class="card">
  <div class="field">
    <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="Enter a password" aria-label="Password">
    <button id="tg" type="button" aria-pressed="false">Show</button>
  </div>
  <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="verdict" aria-live="polite"><strong id="label">Empty</strong><span id="detail">Add characters to begin.</span></div>
  <ul id="checks"></ul>
  <div class="tips" id="tips"></div>
</div>
<p class="note">Length matters most. A long passphrase of random words beats a short string of symbols.</p>
</main>
<script>
(function(){
var pw=document.getElementById('pw'),tg=document.getElementById('tg'),
meter=[].slice.call(document.querySelectorAll('#meter i')),
label=document.getElementById('label'),detail=document.getElementById('detail'),
checks=document.getElementById('checks'),tips=document.getElementById('tips');
var COMMON=['password','123456','12345678','qwerty','abc123','letmein','welcome','admin','iloveyou','monkey','dragon','111111','123123','passw0rd','football','login','princess','sunshine'];
var LEVELS=[['Very weak','var(--r0)'],['Weak','var(--r1)'],['Fair','var(--r2)'],['Strong','var(--r3)'],['Very strong','var(--r4)']];
var RULES=[
['At least 12 characters',function(s){return s.length>=12}],
['Lowercase and uppercase letters',function(s){return /[a-z]/.test(s)&&/[A-Z]/.test(s)}],
['A number',function(s){return /\d/.test(s)}],
['A symbol',function(s){return /[^A-Za-z0-9]/.test(s)}],
['No common password or repeated pattern',function(s){return s.length>0&&!isCommon(s)&&!/(.)\1{2,}/.test(s)&&!seq(s)}]
];
function isCommon(s){var l=s.toLowerCase().replace(/[^a-z0-9]/g,'');return COMMON.some(function(c){return l===c||(c.length>=6&&l.indexOf(c)>-1)})}
function seq(s){var l=s.toLowerCase(),a='abcdefghijklmnopqrstuvwxyz0123456789',rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
for(var i=0;i<=l.length-4;i++){var p=l.substr(i,4),r=p.split('').reverse().join('');
if(a.indexOf(p)>-1||a.indexOf(r)>-1)return true;
for(var j=0;j<rows.length;j++)if(rows[j].indexOf(p)>-1||rows[j].indexOf(r)>-1)return true}
return false}
function entropy(s){var pool=0;
if(/[a-z]/.test(s))pool+=26;if(/[A-Z]/.test(s))pool+=26;if(/\d/.test(s))pool+=10;if(/[^A-Za-z0-9]/.test(s))pool+=33;
if(!pool)return 0;
var uniq={};for(var i=0;i<s.length;i++)uniq[s[i]]=1;
var eff=Math.min(s.length,Object.keys(uniq).length*2.5);
var bits=eff*Math.log(pool)/Math.LN2;
if(isCommon(s))bits=Math.min(bits,14);
if(seq(s))bits*=.6;
if(/(.)\1{2,}/.test(s))bits*=.8;
return bits}
function crack(bits){var sec=Math.pow(2,bits)/2/1e10;
if(sec<1)return'instantly';
var u=[[60,'seconds'],[60,'minutes'],[24,'hours'],[365,'days'],[1000,'years'],[1000,'thousand years'],[1000,'million years'],[1000,'billion years']],v=sec,i=0;
if(v<60)return Math.round(v)+' seconds';
v/=60;for(i=1;i<u.length;i++){if(v<u[i][0]||i===u.length-1)return(v>=1e6?'trillions of years':Math.round(v)+' '+u[i][1]);v/=u[i][0]}
return'ages'}
function render(){
var s=pw.value,bits=entropy(s),lvl;
checks.innerHTML='';var pass=0;
RULES.forEach(function(r){var ok=r[1](s);if(ok)pass++;
var li=document.createElement('li');li.className=ok?'ok':'';
li.innerHTML='<b>'+(ok?'\u2713':'')+'</b><span></span>';li.lastChild.textContent=r[0];checks.appendChild(li)});
if(!s){label.textContent='Empty';detail.textContent='Add characters to begin.';meter.forEach(function(m){m.style.background=''});tips.textContent='';return}
lvl=bits<28?0:bits<40?1:bits<60?2:bits<80?3:4;
if(s.length<8)lvl=Math.min(lvl,1);
if(isCommon(s))lvl=0;
meter.forEach(function(m,i){m.style.background=i<=lvl?LEVELS[lvl][1]:''});
label.textContent=LEVELS[lvl][0];
detail.textContent=s.length+' characters \u00b7 ~'+Math.round(bits)+' bits \u00b7 offline guess time: '+crack(bits);
var t=[];
if(isCommon(s))t.push('This matches a commonly used password. Pick something unrelated to it.');
if(s.length<12)t.push('Add length: aim for 12 or more characters, or a passphrase of 4+ random words.');
if(seq(s))t.push('Avoid keyboard or alphabet runs like "qwer" or "abcd".');
if(/(.)\1{2,}/.test(s))t.push('Avoid repeating the same character three or more times.');
if(!t.length&&lvl>=3)t.push('Good. Use it on one account only and store it in a password manager.');
tips.textContent=t.join(' ')}
pw.addEventListener('input',render);
tg.addEventListener('click',function(){var h=pw.type==='password';pw.type=h?'text':'password';tg.textContent=h?'Hide':'Show';tg.setAttribute('aria-pressed',h)});
render()})();
</script>
</body>
</html>
